{% extends "base.html" %}

{% block content %}
<div class="jumbotron">
	<div class="container">
		<h1>LOGIN</h1>
	</div>
</div>

<div class="container">
	<div class="row justify-content-center">
		<div class="col-lg-5 col-md-7">
			<div class="inferno-box">
				<canvas class="fire-bg"></canvas>
				<div class="box-content">
					<div class="header-section">
						<h2>WELCOME BACK</h2>
						<p>Sign in to your account</p>
					</div>

					{% with form = Forms.auth.LoginForm() %}
					<form method="post" accept-charset="utf-8">
						<div class="form-field">
							<label>USERNAME</label>
							<input type="text" name="name" placeholder="Enter username" required autofocus>
						</div>

						<div class="form-field">
							<label>PASSWORD</label>
							<div class="password-wrap">
								<input type="password" id="password" name="password" placeholder="Enter password" required>
								<button type="button" class="eye-btn" onclick="togglePassword()">
									<svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
										<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
										<circle cx="12" cy="12" r="3"></circle>
									</svg>
								</button>
							</div>
						</div>

						<div class="form-options">
							<a href="{{ url_for('auth.reset_password') }}">Forgot password?</a>
						</div>

						{{ form.nonce() }}
						<button type="submit" class="submit-btn">LOGIN</button>
					</form>
					{% endwith %}

					<div class="box-footer">
						<p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<style>
.inferno-box {
	background: linear-gradient(135deg, #1a0500, #2d0a00);
	border: 2px solid rgba(255, 100, 0, 0.5);
	margin: 3rem 0;
	position: relative;
	overflow: hidden;
	box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 60px rgba(255,60,0,0.2);
}

.fire-bg {
	position: absolute;
	bottom: 0; left: 0;
	width: 100%; height: 100%;
	pointer-events: none;
	opacity: 0.2;
}

.box-content {
	position: relative;
	z-index: 1;
	padding: 3rem 2.5rem;
}

.header-section {
	text-align: center;
	margin-bottom: 2.5rem;
	padding-bottom: 2rem;
	border-bottom: 1px solid rgba(255, 100, 0, 0.2);
}

.header-section h2 {
	color: #ff6600;
	font-family: "Rajdhani", sans-serif;
	font-size: 1.8rem;
	font-weight: 700;
	letter-spacing: 3px;
	text-shadow: 0 0 20px rgba(255, 100, 0, 0.8);
	margin-bottom: 0.5rem;
}

.header-section p {
	color: rgba(255, 200, 130, 0.7);
	font-size: 0.95rem;
	margin: 0;
}

.form-field { margin-bottom: 2rem; }

.form-field label {
	display: block;
	color: #ff6600;
	font-family: "Rajdhani", sans-serif;
	font-size: 0.85rem;
	font-weight: 700;
	letter-spacing: 2px;
	margin-bottom: 0.75rem;
}

.form-field input {
	width: 100%;
	background: rgba(26, 5, 0, 0.6);
	border: 2px solid rgba(255, 100, 0, 0.3);
	color: #ffe8d0;
	font-size: 1rem;
	padding: 0.875rem 1rem;
	transition: all 0.3s ease;
}

.form-field input:focus {
	outline: none;
	border-color: #ff6600;
	background: rgba(26, 5, 0, 0.9);
	box-shadow: 0 0 0 3px rgba(255, 100, 0, 0.15), inset 0 0 20px rgba(255, 60, 0, 0.1);
}

.form-field input::placeholder { color: rgba(255, 160, 80, 0.4); }

.password-wrap { position: relative; }
.password-wrap input { padding-right: 45px; }

.eye-btn {
	position: absolute;
	right: 12px; top: 50%;
	transform: translateY(-50%);
	background: none; border: none;
	color: rgba(255, 100, 0, 0.6);
	cursor: pointer; padding: 0.5rem;
	transition: color 0.3s ease;
}

.eye-btn:hover { color: #ff6600; }

.form-options { text-align: right; margin-bottom: 1.5rem; }

.form-options a {
	color: rgba(255, 120, 0, 0.8);
	font-size: 0.9rem;
	text-decoration: none;
	transition: color 0.3s ease;
}

.form-options a:hover { color: #ff9500; text-decoration: underline; }

.submit-btn {
	width: 100%;
	background: linear-gradient(135deg, #ff2200, #ff6600);
	border: none;
	color: #000;
	font-family: "Rajdhani", sans-serif;
	font-size: 1rem;
	font-weight: 700;
	letter-spacing: 2px;
	padding: 1rem;
	cursor: pointer;
	transition: all 0.3s ease;
	box-shadow: 0 0 20px rgba(255, 60, 0, 0.5);
	position: relative;
	overflow: hidden;
}

.submit-btn::before {
	content: "";
	position: absolute;
	top: 0; left: -100%;
	width: 100%; height: 100%;
	background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
	transition: left 0.5s ease;
}

.submit-btn:hover::before { left: 100%; }

.submit-btn:hover {
	background: linear-gradient(135deg, #ff6600, #ffcc00);
	transform: translateY(-2px);
	box-shadow: 0 8px 25px rgba(255, 100, 0, 0.6);
}

.box-footer {
	text-align: center;
	margin-top: 2rem;
	padding-top: 2rem;
	border-top: 1px solid rgba(255, 100, 0, 0.2);
}

.box-footer p { color: rgba(255, 200, 130, 0.7); font-size: 0.95rem; margin: 0; }
.box-footer a { color: #ff6600; font-weight: 600; text-decoration: none; transition: color 0.3s ease; }
.box-footer a:hover { color: #ffcc00; text-decoration: underline; }

@media (max-width: 768px) { .box-content { padding: 2rem 1.5rem; } }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const canvas = document.querySelector('.fire-bg');
    const ctx = canvas.getContext('2d');
    const box = document.querySelector('.inferno-box');

    function resize() { canvas.width = box.offsetWidth; canvas.height = box.offsetHeight; }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    const MAX = 80;

    function spawnParticle() {
        particles.push({
            x: Math.random() * canvas.width,
            y: canvas.height + 5,
            vx: (Math.random() - 0.5) * 0.6,
            vy: -(Math.random() * 0.8 + 0.4),
            life: 1.0,
            decay: Math.random() * 0.015 + 0.01,
            size: Math.random() * 4 + 2
        });
    }

    function getColor(life) {
        if (life > 0.7) return `rgba(255, ${Math.floor(180 + 75 * life)}, 0, ${life})`;
        if (life > 0.4) return `rgba(255, ${Math.floor(life * 160)}, 0, ${life})`;
        return `rgba(180, 0, 0, ${life * 0.5})`;
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 3 && particles.length < MAX; i++) spawnParticle();

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx + Math.sin(Date.now() * 0.002 + i) * 0.25;
            p.y += p.vy;
            p.life -= p.decay;

            if (p.life <= 0) { particles.splice(i, 1); continue; }

            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
            grad.addColorStop(0, getColor(p.life));
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.fillStyle = grad;
            ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(animate);
    }

    animate();
});

function togglePassword() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
}
</script>
{% endblock %}
