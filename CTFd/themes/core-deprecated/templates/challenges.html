{% extends "base.html" %}

{% block stylesheets %}
	<link rel="stylesheet" href="{{ url_for('views.themes', path='css/challenge-board.css') }}">
	<link rel="stylesheet" href="{{ url_for('views.themes', path='css/challenge-theme.css') }}">

	<style>
	/* INFERNO THEME - CHALLENGES PAGE */

	/* Loading State */
	.spinner {
		color: #ff6600 !important;
		filter: drop-shadow(0 0 15px rgba(255, 100, 0, 0.8));
	}

	.min-vh-50 p {
		color: #ff6600;
		font-family: "Rajdhani", sans-serif;
		font-size: 1.1rem;
		font-weight: 700;
		letter-spacing: 2px;
		text-transform: uppercase;
	}

	/* Challenges Board */
	#challenges-board {
		position: relative;
		padding: 2rem 0;
	}

	/* Category Headers */
	.challenge-category {
		margin-bottom: 3rem;
	}

	.category-header {
		background: linear-gradient(135deg, #1a0500 0%, #2d0a00 100%);
		border-left: 4px solid #ff6600;
		padding: 1rem 1.5rem;
		margin-bottom: 1.5rem;
		position: relative;
	}

	.category-header::before {
		content: "";
		position: absolute;
		top: 0; left: 0;
		width: 4px; height: 100%;
		background: linear-gradient(180deg, #ff2200, #ffcc00);
		box-shadow: 0 0 10px rgba(255, 100, 0, 0.8);
	}

	.category-name {
		color: #ff6600;
		font-family: "Rajdhani", sans-serif;
		font-size: 1.5rem;
		font-weight: 700;
		text-transform: uppercase;
		letter-spacing: 2px;
		margin: 0;
		text-shadow: 0 0 10px rgba(255, 100, 0, 0.6);
	}

	/* Challenge Cards */
	.challenge-card {
		background: linear-gradient(135deg, #1a0500 0%, #2d0a00 100%);
		border: 2px solid rgba(255, 100, 0, 0.3);
		border-radius: 0;
		padding: 1.5rem;
		margin-bottom: 1rem;
		transition: all 0.3s ease;
		position: relative;
		cursor: pointer;
		overflow: hidden;
	}

	.challenge-card::before {
		content: "";
		position: absolute;
		top: 0; left: 0;
		width: 3px; height: 0;
		background: linear-gradient(180deg, #ff2200, #ffcc00);
		transition: height 0.3s ease;
	}

	/* Ember glow sweep on hover */
	.challenge-card::after {
		content: "";
		position: absolute;
		bottom: 0; left: 0;
		width: 100%; height: 2px;
		background: linear-gradient(90deg, transparent, #ff6600, transparent);
		opacity: 0;
		transition: opacity 0.3s ease;
	}

	.challenge-card:hover {
		border-color: #ff6600;
		box-shadow: 0 0 25px rgba(255, 80, 0, 0.3);
		transform: translateX(5px);
	}

	.challenge-card:hover::before { height: 100%; }
	.challenge-card:hover::after  { opacity: 1; }

	/* Solved State */
	.challenge-card.solved {
		border-color: #ffcc00;
		background: linear-gradient(135deg, rgba(255, 180, 0, 0.05) 0%, #2d0a00 100%);
	}

	.challenge-card.solved::before {
		background: #ffcc00;
		height: 100%;
	}

	.challenge-card.solved:hover {
		border-color: #ffcc00;
		box-shadow: 0 0 25px rgba(255, 200, 0, 0.3);
	}

	/* Locked State */
	.challenge-card.locked {
		border-color: rgba(100, 30, 0, 0.5);
		opacity: 0.5;
		cursor: not-allowed;
	}

	.challenge-card.locked::before { background: #3d1200; }
	.challenge-card.locked:hover { transform: none; box-shadow: none; }

	/* Challenge Name */
	.challenge-name {
		color: #ff9500;
		font-family: "Rajdhani", sans-serif;
		font-size: 1.2rem;
		font-weight: 700;
		margin: 0;
		transition: all 0.3s ease;
	}

	.challenge-card:hover .challenge-name {
		color: #ffcc00;
		text-shadow: 0 0 10px rgba(255, 200, 0, 0.6);
	}

	.challenge-card.solved .challenge-name { color: #ffcc00; }

	/* Challenge Value Badge */
	.challenge-value {
		background: rgba(255, 100, 0, 0.15);
		border: 1px solid #ff6600;
		color: #ff6600;
		font-family: "Rajdhani", sans-serif;
		font-size: 1rem;
		font-weight: 700;
		padding: 0.25rem 0.75rem;
		white-space: nowrap;
		border-radius: 0;
	}

	.challenge-card.solved .challenge-value {
		background: rgba(255, 200, 0, 0.15);
		border-color: #ffcc00;
		color: #ffcc00;
	}

	/* Challenge Description */
	.challenge-description {
		color: rgba(255, 220, 170, 0.8);
		font-size: 0.95rem;
		line-height: 1.6;
		margin-bottom: 1rem;
	}

	/* Challenge Header Row */
	.challenge-header {
		display: flex;
		justify-content: space-between;
		align-items: flex-start;
		margin-bottom: 1rem;
		flex-wrap: wrap;
		gap: 0.5rem;
	}

	/* Tags */
	.challenge-tags {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		margin-bottom: 1rem;
	}

	.challenge-tag {
		background: rgba(255, 60, 0, 0.1);
		border: 1px solid rgba(255, 100, 0, 0.4);
		color: #ff9500;
		font-family: "Rajdhani", sans-serif;
		font-size: 0.75rem;
		font-weight: 600;
		padding: 0.2rem 0.6rem;
		text-transform: uppercase;
		letter-spacing: 1px;
		border-radius: 0;
	}

	/* Challenge Footer */
	.challenge-footer {
		display: flex;
		justify-content: space-between;
		align-items: center;
		margin-top: 1rem;
		padding-top: 1rem;
		border-top: 1px solid rgba(255, 100, 0, 0.2);
	}

	.challenge-solves {
		color: rgba(255, 180, 100, 0.6);
		font-size: 0.9rem;
	}

	.challenge-solves i { color: #ff6600; margin-right: 0.5rem; }

	/* Status Badges */
	.status-badge {
		font-family: "Rajdhani", sans-serif;
		font-size: 0.8rem;
		font-weight: 700;
		padding: 0.3rem 0.75rem;
		text-transform: uppercase;
		letter-spacing: 1px;
		border-radius: 0;
	}

	.status-badge.solved {
		background: rgba(255, 200, 0, 0.15);
		border: 1px solid #ffcc00;
		color: #ffcc00;
	}

	.status-badge.locked {
		background: rgba(100, 30, 0, 0.3);
		border: 1px solid rgba(255, 60, 0, 0.3);
		color: rgba(255, 100, 0, 0.5);
	}

	/* Empty State */
	.empty-state {
		text-align: center;
		padding: 4rem 2rem;
		background: linear-gradient(135deg, #1a0500, #2d0a00);
		border: 2px dashed rgba(255, 100, 0, 0.3);
		border-radius: 0;
	}

	.empty-state i { color: rgba(255, 100, 0, 0.4); font-size: 4rem; margin-bottom: 1.5rem; }
	.empty-state h3 { color: #ff6600; font-family: "Rajdhani", sans-serif; }
	.empty-state p  { color: rgba(255, 200, 130, 0.6); }

	/* Animations */
	@keyframes fadeInUp {
		from { opacity: 0; transform: translateY(20px); }
		to   { opacity: 1; transform: translateY(0); }
	}

	.fade-in { animation: fadeInUp 0.5s ease; }

	/* Responsive */
	@media (max-width: 768px) {
		.challenge-header { flex-direction: column; }
		.challenge-footer { flex-direction: column; gap: 0.5rem; text-align: center; }
	}

	/* core-deprecated challenge board uses .challenge-button and .solved-challenge */
	#challenges-board .challenge-button {
		background: linear-gradient(135deg, #1a0500 0%, #2d0a00 100%);
		border: 2px solid rgba(255, 100, 0, 0.3);
		border-radius: 0;
		box-shadow: none;
		position: relative;
		overflow: hidden;
		transition: all 0.3s ease;
	}

	#challenges-board .challenge-button::before {
		content: "";
		position: absolute;
		top: 0;
		left: 0;
		width: 3px;
		height: 0;
		background: linear-gradient(180deg, #ff2200, #ffcc00);
		transition: height 0.3s ease;
	}

	#challenges-board .challenge-button::after {
		content: "";
		position: absolute;
		bottom: 0;
		left: 0;
		width: 100%;
		height: 2px;
		background: linear-gradient(90deg, transparent, #ff6600, transparent);
		opacity: 0;
		transition: opacity 0.3s ease;
	}

	#challenges-board .challenge-button:hover {
		border-color: #ff6600;
		box-shadow: 0 0 25px rgba(255, 80, 0, 0.3);
		transform: translateX(5px);
	}

	#challenges-board .challenge-button:hover::before { height: 100%; }
	#challenges-board .challenge-button:hover::after { opacity: 1; }

	#challenges-board .challenge-button p {
		color: #ff9500;
		font-family: "Rajdhani", sans-serif;
		font-size: 1.2rem;
		font-weight: 700;
		margin: 0;
	}

	#challenges-board .challenge-button span {
		background: rgba(255, 100, 0, 0.15);
		border: 1px solid #ff6600;
		color: #ff6600;
		font-family: "Rajdhani", sans-serif;
		font-size: 1rem;
		font-weight: 700;
		padding: 0.25rem 0.75rem;
		border-radius: 0;
		display: inline-block;
	}

	#challenges-board .challenge-button.solved-challenge {
		border-color: #ffcc00;
		background: linear-gradient(135deg, rgba(255, 180, 0, 0.05) 0%, #2d0a00 100%);
	}

	#challenges-board .challenge-button.solved-challenge::before {
		background: #ffcc00;
		height: 100%;
	}

	#challenges-board .challenge-button.solved-challenge p,
	#challenges-board .challenge-button.solved-challenge span {
		color: #ffcc00;
		border-color: #ffcc00;
	}
	</style>
{% endblock %}

{% block content %}

<!-- Challenge Modal -->
<div class="modal fade" id="challenge-window" tabindex="-1" role="dialog">
</div>

<!-- Main Container -->
<div class="container">
	<div class="row">
		<div class="col-md-12">
			{% include "components/errors.html" %}
		</div>
	</div>

	<div id='challenges-board'>
		<div class="min-vh-50 d-flex align-items-center">
			<div class="text-center w-100">
				<i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
				<p class="mt-3">Loading challenges...</p>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
	const observer = new MutationObserver(function(mutations) {
		mutations.forEach(function(mutation) {
			if (mutation.addedNodes.length) {
				mutation.addedNodes.forEach(function(node) {
					if (node.classList && node.classList.contains('challenge-card')) {
						node.style.opacity = '0';
						setTimeout(function() {
							node.style.transition = 'opacity 0.5s ease';
							node.style.opacity = '1';
						}, 100);
					}
				});
			}
		});
	});

	const board = document.getElementById('challenges-board');
	if (board) observer.observe(board, { childList: true, subtree: true });

	document.addEventListener('keydown', function(e) {
		if (e.key === 'Escape') {
			const modal = document.getElementById('challenge-window');
			if (modal && modal.classList.contains('show')) $(modal).modal('hide');
		}
	});
});
</script>
{% endblock %}

{% block entrypoint %}
	<script defer src="{{ url_for('views.themes', path='js/pages/challenges.js') }}"></script>
{% endblock %}
